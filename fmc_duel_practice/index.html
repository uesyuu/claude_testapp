<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FMC Duel Practice</title>
  <script src="min2phase.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #1a1a1a;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      user-select: none;
      overflow: hidden;
    }

    #topbar {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      padding: 20px 32px;
      flex-shrink: 0;
    }

    #scramble {
      flex: 1;
      font-size: 3.2rem;
      font-weight: 500;
      color: #d0d0d0;
      letter-spacing: 0.05em;
      word-break: break-word;
      line-height: 1.3;
    }

    #scramble.loading {
      color: #666;
      font-size: 1.5rem;
    }

    #timer {
      flex-shrink: 0;
      font-size: 4.4rem;
      font-weight: 500;
      color: #a0c4ff;
      letter-spacing: 0.02em;
    }

    #timer.running { color: #69f0ae; }
    #timer.timeout { color: #ff5252; }
    #timer.stopped { color: #ffd740; }

    #main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #counter {
      font-size: clamp(5rem, 22vw, 10rem);
      font-weight: bold;
      font-family: Arial, sans-serif;
      color: #ffffff;
      line-height: 1;
    }

    #controls {
      display: flex;
      gap: 12px;
      padding: 16px 24px;
      padding-bottom: max(16px, env(safe-area-inset-bottom, 16px));
      flex-shrink: 0;
    }

    #controls button {
      flex: 1;
      padding: 20px 8px;
      font-size: 1.1rem;
      font-weight: bold;
      font-family: 'Courier New', monospace;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      touch-action: manipulation;
      transition: opacity 0.15s, transform 0.1s;
      line-height: 1.3;
    }

    #controls button:focus {
      outline: none;
    }

    #controls button:active:not(:disabled) {
      transform: scale(0.96);
    }

    #controls button:disabled {
      opacity: 0.25;
      cursor: not-allowed;
    }

    #btn-reset {
      background: #444;
      color: #fff;
    }

    #btn-startstop {
      background: #2e7d32;
      color: #fff;
    }

    #btn-startstop.running {
      background: #b71c1c;
    }

    @media (max-width: 600px) {
      #topbar {
        flex-direction: column;
        gap: 6px;
        padding: 14px 16px;
      }

      #scramble {
        font-size: clamp(1.2rem, 4.5vw, 2.2rem);
      }

      #scramble.loading {
        font-size: 1rem;
      }

      #timer {
        font-size: clamp(2.8rem, 10vw, 3.8rem);
        align-self: flex-end;
      }

      #controls {
        padding: 12px 16px;
        padding-bottom: max(12px, env(safe-area-inset-bottom, 12px));
        gap: 10px;
      }

      #controls button {
        padding: 18px 4px;
        font-size: 1rem;
        border-radius: 10px;
      }
    }

  </style>
</head>
<body>
  <div id="topbar">
    <div id="scramble" class="loading">generating...</div>
    <div id="timer">2:00.00</div>
  </div>
  <div id="main">
    <div id="counter">0</div>
  </div>
  <div id="controls">
    <button id="btn-reset">RESET</button>
    <button id="btn-startstop">START</button>
  </div>

  <script>
    const counterEl = document.getElementById('counter');
    const timerEl = document.getElementById('timer');
    const scrambleEl = document.getElementById('scramble');
    const btnReset = document.getElementById('btn-reset');
    const btnStartStop = document.getElementById('btn-startstop');
    const mainEl = document.getElementById('main');

    setTimeout(() => {
      const scramble = min2phase.solve(min2phase.randomCube());
      scrambleEl.textContent = scramble;
      scrambleEl.classList.remove('loading');
    }, 0);

    const INITIAL_TIME = 2 * 60 * 1000;
    const SPACE_BONUS = 3000;

    let count = 0;
    let running = false;
    let finished = false;
    let deadline = null;
    let rafId = null;

    function formatTime(ms) {
      if (ms < 0) ms = 0;
      const totalCentiseconds = Math.floor(ms / 10);
      const cs = totalCentiseconds % 100;
      const totalSeconds = Math.floor(totalCentiseconds / 100);
      const ss = totalSeconds % 60;
      const mm = Math.floor(totalSeconds / 60);
      const pad2 = n => String(n).padStart(2, '0');
      return `${mm}:${pad2(ss)}.${pad2(cs)}`;
    }

    function updateUI() {
      btnStartStop.disabled = finished;
      if (running) {
        btnStartStop.textContent = 'STOP';
        btnStartStop.classList.add('running');
        mainEl.classList.add('running');
        mainEl.classList.remove('finished');
      } else {
        btnStartStop.textContent = 'START';
        btnStartStop.classList.remove('running');
        mainEl.classList.remove('running');
        if (finished) mainEl.classList.add('finished');
      }
    }

    function tick() {
      if (!running) return;
      const timeLeft = deadline - performance.now();
      if (timeLeft <= 0) {
        running = false;
        finished = true;
        timerEl.textContent = formatTime(0);
        timerEl.classList.remove('running');
        timerEl.classList.add('timeout');
        updateUI();
        return;
      }
      timerEl.textContent = formatTime(timeLeft);
      rafId = requestAnimationFrame(tick);
    }

    function doCount() {
      if (!running) return;
      count++;
      counterEl.textContent = count;
      deadline += SPACE_BONUS;
    }

    function doStartStop() {
      if (finished) return;
      if (!running) {
        running = true;
        deadline = performance.now() + INITIAL_TIME;
        timerEl.classList.add('running');
        rafId = requestAnimationFrame(tick);
      } else {
        running = false;
        finished = true;
        cancelAnimationFrame(rafId);
        timerEl.textContent = formatTime(Math.max(0, deadline - performance.now()));
        timerEl.classList.remove('running');
        timerEl.classList.add('stopped');
      }
      updateUI();
    }

    function reset() {
      cancelAnimationFrame(rafId);
      running = false;
      finished = false;
      count = 0;
      deadline = null;
      counterEl.textContent = '0';
      timerEl.textContent = '2:00.00';
      timerEl.className = '';
      scrambleEl.classList.add('loading');
      scrambleEl.textContent = 'generating...';
      updateUI();
      setTimeout(() => {
        const scramble = min2phase.solve(min2phase.randomCube());
        scrambleEl.textContent = scramble;
        scrambleEl.classList.remove('loading');
      }, 0);
    }

    btnReset.addEventListener('click', reset);
    btnStartStop.addEventListener('click', doStartStop);

    // Mobile: tap anywhere except buttons to count
    document.addEventListener('touchend', (e) => {
      if (e.target.closest('button')) return;
      e.preventDefault();
      doCount();
    }, { passive: false });

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        doCount();
      } else if (e.code === 'Enter') {
        e.preventDefault();
        if (finished) {
          reset();
        } else {
          doStartStop();
        }
      }
    });

    updateUI();
  </script>
</body>
</html>
